
<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="apple-touch-icon" href="icon.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f2f2f7">
  <title>SSC Tool</title>

  <style>
    :root {
      color-scheme: light;
      --bg: #f2f2f7;
      --surface: #fff;
      --text: #1c1c1e;
      --secondary: #6c6c70;
      --border: #d1d1d6;
      --field: #f9f9fb;
      --accent: #007aff;
      --success: #248a3d;
    }

    body.dark {
      color-scheme: dark;
      --bg: #000;
      --surface: #1c1c1e;
      --text: #f5f5f7;
      --secondary: #a1a1a6;
      --border: #38383a;
      --field: #2c2c2e;
      --accent: #0a84ff;
      --success: #30d158;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 18px 14px 36px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      transition: background .2s, color .2s;
    }

    .app { max-width: 620px; margin: 0 auto; }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin: 4px 0 22px;
    }

    .brand { display: flex; align-items: center; gap: 12px; }

    .app-icon {
      width: 48px;
      height: 48px;
      border-radius: 11px;
      object-fit: cover;
      background: var(--field);
    }

    h1 { font-size: 26px; margin: 0; letter-spacing: -.6px; }

    .subtitle { color: var(--secondary); font-size: 13px; margin-top: 4px; }

    button, input, textarea { font: inherit; }

    button {
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .icon-button {
      width: 42px;
      height: 42px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface);
      color: var(--text);
      font-size: 20px;
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 16px;
    }

    .mode {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
      padding: 4px;
      border-radius: 11px;
      background: var(--field);
      margin-bottom: 20px;
    }

    .mode button {
      border: 0;
      padding: 12px;
      border-radius: 8px;
      background: transparent;
      color: var(--secondary);
      font-weight: 600;
    }

    .mode button.active { background: var(--accent); color: white; }

    .key-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 16px;
      align-items: end;
    }

    label, .label {
      display: block;
      font-weight: 600;
      font-size: 15px;
      margin-bottom: 8px;
    }

    input, textarea {
      width: 100%;
      padding: 12px;
      color: var(--text);
      background: var(--field);
      border: 1px solid var(--border);
      border-radius: 9px;
      outline: none;
    }

    input:focus, textarea:focus {
      border-color: var(--accent);
    }

    .hint {
      margin-top: 7px;
      font-size: 12px;
      color: var(--secondary);
    }

    .key-value {
      min-width: 70px;
      min-height: 44px;
      display: grid;
      place-items: center;
      padding: 8px 14px;
      border-radius: 9px;
      border: 1px solid var(--border);
      background: var(--field);
      font-size: 20px;
      font-weight: 700;
    }

    .section-heading {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }

    .section-heading label { margin: 0; }

    .small-button {
      border: 1px solid var(--border);
      border-radius: 9px;
      background: var(--surface);
      color: var(--accent);
      padding: 8px 12px;
      font-size: 13px;
      font-weight: 600;
    }

    textarea {
      min-height: 130px;
      resize: vertical;
      line-height: 1.55;
    }

    .primary-button {
      width: 100%;
      margin-top: 15px;
      padding: 14px;
      border: 0;
      border-radius: 10px;
      background: var(--accent);
      color: white;
      font-weight: 700;
      font-size: 16px;
    }

    .output {
      min-height: 130px;
      padding: 13px;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: var(--field);
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      line-height: 1.65;
    }

    .output:empty::before {
      content: "Your result will appear here.";
      color: var(--secondary);
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }

    .status {
      min-height: 20px;
      margin-top: 9px;
      font-size: 13px;
      color: var(--success);
    }

    .footer {
      text-align: center;
      padding: 12px 0;
      color: var(--secondary);
      font-size: 12px;
    }

    @media (max-width: 380px) {
      .panel { padding: 14px; }
      h1 { font-size: 23px; }
    }
  </style>
</head>

<body>
  <main class="app">
    <header>
      <div class="brand">
        <img class="app-icon"
             src="PlaygroundImage.png"
             alt="SSC Tool icon">
        <div>
          <h1>SSC Tool</h1>
          <div class="subtitle">Offline Encode &amp; Decode</div>
        </div>
      </div>
      <button class="icon-button" id="themeButton"
              aria-label="Toggle dark mode">◐</button>
    </header>

    <section class="panel">
      <div class="mode">
        <button id="encodeMode" class="active" aria-pressed="true">
          Encode
        </button>
        <button id="decodeMode" aria-pressed="false">
          Decode
        </button>
      </div>

      <div class="key-row">
        <div>
          <label for="keyCalc">Key Calc</label>
          <input id="keyCalc" type="number" step="1"
                 inputmode="numeric" placeholder="Enter number">
          <div class="hint">Enter a number to calculate the key.</div>
        </div>
        <div>
          <label>Key</label>
          <div class="key-value" id="keyValue">0</div>
        </div>
      </div>
    </section>

    <section class="panel">
      <div class="section-heading">
        <label for="inputText">Input</label>
        <button class="small-button" id="clearButton">Clear</button>
      </div>
      <textarea id="inputText" spellcheck="false"
                placeholder="Enter text here..."></textarea>
      <button class="primary-button" id="convertButton">Encode</button>
    </section>

    <section class="panel">
      <div class="section-heading">
        <label>Output</label>
        <button class="small-button" id="copyButton">Copy</button>
      </div>
      <div class="output" id="outputText"
           aria-live="polite" tabindex="0"></div>
      <div class="actions">
        <button class="small-button" id="saveButton">Save to file</button>
        <button class="small-button" id="useOutputButton">
          Use output as input
        </button>
      </div>
      <div class="status" id="status" aria-live="polite"></div>
    </section>

    <div class="footer">SSC Tool · Offline capable</div>
  </main>

  <script>
    "use strict";

    // Embedded Xcode asset catalog metadata.
    // The actual PNG remains a separate local file.
    const assetCatalog = {
      "images": [
        {
          "idiom": "universal",
          "platform": "ios",
          "size": "1024x1024"
        },
        {
          "appearances": [
            {
              "appearance": "luminosity",
              "value": "dark"
            }
          ],
          "idiom": "universal",
          "platform": "ios",
          "size": "1024x1024"
        },
        {
          "appearances": [
            {
              "appearance": "luminosity",
              "value": "tinted"
            }
          ],
          "filename": "PlaygroundImage.png",
          "idiom": "universal",
          "platform": "ios",
          "size": "1024x1024"
        }
      ],
      "info": {
        "author": "xcode",
        "version": 1
      }
    };

    window.SSCAssetCatalog = assetCatalog;

    const $ = id => document.getElementById(id);
    const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";

    let isEncoding = true;
    let shiftKey = 0;
    let showCopiedFeedback = false;

    // Persist the theme where local browser storage is available.
    try {
      if (localStorage.getItem("isDarkMode") === "true") {
        document.body.classList.add("dark");
      }
    } catch (_) {}

    function updateThemeButton() {
      $("themeButton").textContent =
        document.body.classList.contains("dark") ? "☀" : "◐";
    }

    updateThemeButton();

    $("themeButton").addEventListener("click", () => {
      const dark = document.body.classList.toggle("dark");
      try {
        localStorage.setItem("isDarkMode", String(dark));
      } catch (_) {}
      updateThemeButton();
    });

    // Mirrors the Swift key-calculation special cases.
    function calculateKey(value) {
      if (value.trim() === "") return null;

      const number = Number(value);
      if (!Number.isSafeInteger(number)) return null;

      if (number % 25 === 0) {
        if (number % 10 === 0) return 0;
        if (number % 10 === 5) return 25;
      } else {
        // JavaScript remainder, matching Swift for positive inputs.
        return number % 25;
      }

      return 0;
    }

    $("keyCalc").addEventListener("input", () => {
      const result = calculateKey($("keyCalc").value);

      if (result !== null) {
        shiftKey = result;
        $("keyValue").textContent = shiftKey;
      } else if ($("keyCalc").value.trim() === "") {
        shiftKey = 0;
        $("keyValue").textContent = 0;
      }
    });

    function setMode(encoding) {
      isEncoding = encoding;

      $("encodeMode").classList.toggle("active", encoding);
      $("decodeMode").classList.toggle("active", !encoding);
      $("encodeMode").setAttribute("aria-pressed", String(encoding));
      $("decodeMode").setAttribute("aria-pressed", String(!encoding));
      $("convertButton").textContent = encoding ? "Encode" : "Decode";
      $("inputText").placeholder = encoding
        ? "Enter text here..."
        : "Enter encoded text here...";
      $("status").textContent = "";
    }

    $("encodeMode").addEventListener("click", () => setMode(true));
    $("decodeMode").addEventListener("click", () => setMode(false));

    // Faithful port of the Swift encode(text:shift:) function.
    function encode(text, shift) {
      let result = "";

      // Swift split(omittingEmptySubsequences: false) preserves empty
      // components around whitespace separators.
      const components = text.split(/\s/u);

      for (let wordIndex = 0; wordIndex < components.length; wordIndex++) {
        const word = components[wordIndex];

        if (wordIndex > 0) {
          result += wordIndex < components.length - 1 ? "  " : " ";
        }

        let isFirstInWord = true;

        for (const char of word) {
          // Swift Character.isLetter recognizes Unicode letters.
          if (/\p{L}/u.test(char)) {
            const upper = char.toUpperCase();
            const baseChar = Array.from(upper)[0];
            const index = alphabet.indexOf(baseChar);

            if (index !== -1) {
              const shiftedIndex = ((index + shift) % 26 + 26) % 26;

              if (!isFirstInWord) result += "•";

              result += String(shiftedIndex);
              isFirstInWord = false;
            }
          } else if (/\p{P}|\p{S}/u.test(char)) {
            result += char;
          } else {
            result += char;
          }
        }
      }

      return result;
    }

    // Faithful port of the Swift decode(text:shift:) function.
    function decode(text, shift) {
      let result = "";
      let currentNumber = "";

      function appendNumber() {
        if (currentNumber.length === 0) return;

        const number = Number(currentNumber);

        if (Number.isSafeInteger(number)) {
          // Keep the Swift modulo-26 decoding behavior.
          const shiftedIndex = ((number - shift + 26) % 26 + 26) % 26;
          result += alphabet[shiftedIndex].toLowerCase();
        }

        currentNumber = "";
      }

      for (const char of text) {
        if (/\p{N}/u.test(char) && /^[0-9]$/.test(char)) {
          currentNumber += char;
        } else if (char === "•") {
          appendNumber();
        } else if (/\s/u.test(char)) {
          appendNumber();
          result += char;
        } else if (/\p{P}|\p{S}/u.test(char)) {
          appendNumber();
          result += char;
        }
        // Other characters are ignored, as in the original Swift code.
      }

      appendNumber();
      return result;
    }

    $("convertButton").addEventListener("click", () => {
      const input = $("inputText").value;

      $("outputText").textContent = isEncoding
        ? encode(input, shiftKey)
        : decode(input, shiftKey);

      $("status").textContent = "Conversion complete.";
    });

    $("clearButton").addEventListener("click", () => {
      $("inputText").value = "";
      $("outputText").textContent = "";
      $("status").textContent = "";
      $("inputText").focus();
    });

    $("copyButton").addEventListener("click", async () => {
      const output = $("outputText").textContent;

      if (!output) {
        $("status").textContent = "There is no output to copy.";
        return;
      }

      // Preserve the original Swift copy behavior that strips a U
      // immediately before a number, if such markers appear.
      const processedText = output.replace(/U(?=[0-9])/g, "");

      try {
        await navigator.clipboard.writeText(processedText);
        showCopiedFeedback = true;
        $("status").textContent = "Copied!";

        setTimeout(() => {
          showCopiedFeedback = false;
          if ($("status").textContent === "Copied!") {
            $("status").textContent = "";
          }
        }, 2000);
      } catch (_) {
        const temporary = document.createElement("textarea");
        temporary.value = processedText;
        temporary.style.position = "fixed";
        temporary.style.opacity = "0";
        document.body.appendChild(temporary);
        temporary.select();

        let copied = false;
        try {
          copied = document.execCommand("copy");
        } catch (_) {}

        temporary.remove();
        $("status").textContent = copied
          ? "Copied!"
          : "Copy unavailable. Select the output and copy it manually.";
      }
    });

    $("saveButton").addEventListener("click", () => {
      const output = $("outputText").textContent;

      if (!output) {
        $("status").textContent = "There is no output to save.";
        return;
      }

      const blob = new Blob([output], {
        type: "text/plain;charset=utf-8"
      });

      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = "ssc_output.txt";
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);

      $("status").textContent = "Save requested.";
    });

    $("useOutputButton").addEventListener("click", () => {
      $("inputText").value = $("outputText").textContent;
      $("outputText").textContent = "";
      $("status").textContent = "Output moved to input.";
      $("inputText").focus();
    });
  </script>
</body>
</html>
